name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: check · test · build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Smoke-test the built server
        run: |
          PORT=3000 PROVIDER_FAILURE_RATE=0 node dist/server/index.js &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && break; sleep 0.5; done
          curl -sf http://localhost:3000/ | grep -q '<div id="app">'
          curl -sf "http://localhost:3000/api/search?q=pizza" | grep -q '"total":6'
